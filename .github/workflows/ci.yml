name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,openai,service]"

      - name: Ruff
        run: ruff check src

      - name: Mypy
        run: mypy src

      - name: Pytest (default suite -- no external services)
        run: python -m pytest -m "not gpu and not service and not docling"
