[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-docolage"
version = "0.1.0"
description = "Self-hosted document parsing pipeline mirroring ai_parse_document's output shape, without a Databricks Model Provider."
readme = "CONTEXT.md"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0.0",
    "pypdfium2>=4.30.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "reportlab>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: real-GPU smoke tests excluded from the default run",
]
