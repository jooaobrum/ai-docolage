[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-docolage"
version = "0.1.2"
description = "Self-hosted document parsing pipeline mirroring ai_parse_document's output shape, without a Databricks Model Provider."
readme = "CONTEXT.md"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0.0",
    "pypdfium2>=4.30.0",
    "Pillow>=10.0.0",
    # Parses docolage.yaml, the one source of truth for every tunable
    # parameter (settings_loader.py).
    "PyYAML>=6.0.0",
    # docling's standard pipeline (layout model + TableFormer + OCR-when-
    # needed) is the new default recognition engine (ADR-0010) and, unlike
    # PaddleOCR-VL, runs CPU-only out of the box with no GPU-only transitive
    # deps and no hand-provisioned weights directory — so it belongs in the
    # Core's base install rather than an optional extra.
    "docling>=2.0.0",
    # RapidOCR (docling's default OCR engine) auto-selects onnxruntime's
    # optimized CPU kernels when this is importable, falling back to a
    # much slower generic-torch execution path otherwise. Both the .onnx
    # and .pth checkpoints are already baked into the image by
    # `docling-tools models download rapidocr` (Dockerfile.service), so
    # this adds no new model-download step and no new runtime network
    # call -- just picks the faster of two already-local engines.
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "ruff>=0.6.0",
    "reportlab>=4.0.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.23",
    "httpx>=0.27.0",
    "testcontainers[postgres,minio]>=4.0.0",
]
openai = [
    # Real FigureCaptioner backed by the External OpenAI API (ticket #9).
    # Deliberately not in the base dependency set: escalation is optional
    # end to end (CONTEXT.md "Escalation") — a plain install that never
    # configures an OpenAI key shouldn't be forced to resolve this.
    "openai>=1.40.0",
]
service = [
    # The docolage_service package (ticket #19): HTTP API, Postgres-backed
    # queue, object storage. Deliberately not in the base dependency set —
    # spec section "Package boundary": "a plain Core install stays free of
    # the web framework, database driver, and object storage client."
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-json-logger>=2.0.0",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
]

[project.scripts]
docolage-worker = "docolage_service.worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docolage = ["docolage.yaml"]
docolage_service = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not service and not docling'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: real-GPU smoke tests excluded from the default run",
    "service: Service tests needing real Postgres/MinIO, excluded from the default run",
    "docling: real-docling-model smoke tests excluded from the default run",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/", "benchmark/"]
