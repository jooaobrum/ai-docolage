[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-docolage"
version = "0.1.0"
description = "Self-hosted document parsing pipeline mirroring ai_parse_document's output shape, without a Databricks Model Provider."
readme = "CONTEXT.md"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0.0",
    "pypdfium2>=4.30.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "reportlab>=4.0.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.23",
]
paddleocr = [
    # PaddleOCR-VL-1.6 real recognizer (ticket #6). Deliberately not in the
    # base dependency set: it pulls in PaddlePaddle-GPU, which markdown-only
    # or CPU-only installs shouldn't be forced to resolve. Install on the
    # GPU cluster only.
    "paddleocr[doc-parser]>=3.7.0,<3.8.0",
]
openai = [
    # Real FigureCaptioner backed by the External OpenAI API (ticket #9).
    # Deliberately not in the base dependency set: escalation is optional
    # end to end (CONTEXT.md "Escalation") — a plain install that never
    # configures an OpenAI key shouldn't be forced to resolve this.
    "openai>=1.40.0",
]
spark = [
    # parse_udf / mapInPandas batch entry point (ticket #11). Deliberately
    # not in the base dependency set: docolage.parse() (single-document
    # use) has no Spark dependency at all, and on a real Databricks
    # cluster pyspark is already provided by the runtime.
    "pyspark>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = [
    "gpu: real-GPU smoke tests excluded from the default run",
]
